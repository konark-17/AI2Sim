# docker-compose.yml — Local development with hot-reload
# Usage: docker compose up

version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai2sim-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai2sim-backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "qwen2.5-coder:7b"
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:4173"
    depends_on:
      - ollama
    restart: unless-stopped

  # Pull the model automatically
  model-puller:
    image: ollama/ollama:latest
    container_name: ai2sim-model-puller
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      sh -c "sleep 5 &&
             ollama pull qwen2.5-coder:7b &&
             echo 'Model ready'"
    depends_on:
      - ollama
    restart: "no"

volumes:
  ollama_data:
